<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="话本 Huaben">
  <!-- 草稿:醒木 + 油灯("灯下说书")。墨色底、琥珀色火光、木色醒木 -->
  <defs>
    <radialGradient id="glow" cx="256" cy="200" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2b544" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f2b544" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.55" stop-color="#f2b544"/>
      <stop offset="1" stop-color="#d9772b"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5a34"/>
      <stop offset="1" stop-color="#6b3a20"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#1d1916"/>
  <g transform="translate(0,46)">
  <circle cx="256" cy="200" r="190" fill="url(#glow)"/>

  <!-- 火苗 -->
  <path d="M256 92 C 286 140, 300 168, 300 196 C 300 224, 280 246, 256 246 C 232 246, 212 224, 212 196 C 212 168, 228 140, 256 92 Z" fill="url(#flame)"/>
  <path d="M256 160 C 268 180, 274 194, 274 206 C 274 220, 266 230, 256 230 C 246 230, 238 220, 238 206 C 238 194, 244 180, 256 160 Z" fill="#fff6d8" opacity="0.85"/>

  <!-- 灯盏 -->
  <path d="M196 262 H316 C 316 290, 290 306, 256 306 C 222 306, 196 290, 196 262 Z" fill="#c98f3a"/>
  <rect x="246" y="246" width="20" height="18" rx="4" fill="#3a2a1c"/>

  <!-- 醒木 -->
  <path d="M120 306 L392 306 L408 336 L104 336 Z" fill="#b8754a"/>
  <rect x="104" y="336" width="304" height="46" rx="8" fill="url(#wood)"/>
  <rect x="140" y="352" width="232" height="6" rx="3" fill="#4d2a17" opacity="0.6"/>
</g>
</svg>
