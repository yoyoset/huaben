# 话本配音设置。改完点窗口里的「重新启动」生效。以 # 开头的行是说明。

# 话本服务器地址
server=http://10.1.1.13:8210
# 配音引擎:kokoro-zh(显卡上的中文模型)
engine=kokoro-zh
# 音色:zf_ 开头是女声(如 zf_001 zf_002 zf_017),zm_ 开头是男声(如 zm_009 zm_010)。
# 编号不连续,写了不存在的会在日志里报错;完整列表见 pc_worker\README.md
voice=zf_001
# 语速倍率:1.0 正常,1.2 快一些
speed=1.0
# 服务器设了配音令牌(HUABEN_VOICE_WORKER_TOKEN)才需要填
token=
